name: Compile examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  esp32-panel-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: LovyanGFX
          sketch-paths: |
            - esp32-lovyangfx/panel_test
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=-DLCD_PANEL=${{ matrix.panel }}

  ht1621-avr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - arduino-ht1621/ht1621_demo

  ht1621-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          g++ -std=c++11 -Wall -Wextra -I test/stub -I arduino-ht1621/ht1621_demo \
              test/ht1621_host_test.cpp -o ht1621_test
          ./ht1621_test
